
name: PR checks

on:
  pull_request:
    branches:
      - master
      - dev

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show checks
        uses: ./.github/actions/pr-steps
        with:
          step: init

      - name: Building
        id: deployment
        uses: ./.github/actions/deployment-status
        with:
          state: Building
          service: frontend
          environment: Preview

      - name: Install running
        uses: ./.github/actions/pr-steps
        with:
          step: install
          state: running

      - name: Setup Node.js
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Install status
        if: always()
        uses: ./.github/actions/pr-steps
        with:
          step: install
          state: ${{ steps.node.outcome != 'success' && steps.node.outcome != 'skipped' && steps.node.outcome || steps.install.outcome }}

      - name: Lint running
        if: success()
        uses: ./.github/actions/pr-steps
        with:
          step: lint
          state: running

      - name: Lint
        id: lint
        if: success()
        run: npm run lint

      - name: Lint status
        if: always()
        uses: ./.github/actions/pr-steps
        with:
          step: lint
          state: ${{ steps.lint.outcome }}

      - name: Test running
        if: success()
        uses: ./.github/actions/pr-steps
        with:
          step: test
          state: running

      - name: Test
        id: test
        if: success()
        run: npm run test

      - name: Test status
        if: always()
        uses: ./.github/actions/pr-steps
        with:
          step: test
          state: ${{ steps.test.outcome }}

      - name: Build running
        if: success()
        uses: ./.github/actions/pr-steps
        with:
          step: build
          state: running

      - name: Build
        id: build
        if: success()
        run: npm run build

      - name: Build status
        if: always()
        uses: ./.github/actions/pr-steps
        with:
          step: build
          state: ${{ steps.build.outcome }}

      - name: Ready
        if: success()
        uses: ./.github/actions/deployment-status
        with:
          state: Ready
          service: frontend
          environment: Preview
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Error
        if: failure()
        uses: ./.github/actions/deployment-status
        with:
          state: Error
          service: frontend
          environment: Preview
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Cancelled
        if: cancelled()
        uses: ./.github/actions/deployment-status
        with:
          state: Cancelled
          service: frontend
          environment: Preview
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
