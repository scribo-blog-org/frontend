# Проверки pull request в master для Next.js (сервис frontend).
# Образ собирается локально и не публикуется. Ненулевой код любого шага роняет job.

name: PR checks

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  deployments: write

jobs:
  check:
    name: Build
    runs-on: ubuntu-latest
    steps:
      # Код репозитория на раннере
      - name: Checkout
        uses: actions/checkout@v4

      - name: Building
        id: deployment
        uses: ./.github/actions/deployment-status
        with:
          state: Building
          service: frontend
          environment: Preview

      # В package.json нет engines.node, поэтому берём текущий LTS. Кэш npm по package-lock.json
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm

      # Зависимости строго по lock-файлу
      - name: Install dependencies
        run: npm ci

      # Скрипт lint уже есть в package.json
      - name: Lint
        run: npm run lint

      # Отдельных тестов нет: в package.json стоит плейсхолдер, который завершается с кодом 0
      - name: Test
        run: npm run test

      # Сборка по локальному Dockerfile. В registry ничего не уходит
      - name: Docker build
        run: docker build -t "${{ github.repository }}:pr-${{ github.event.number }}" .

      - name: Ready
        if: success()
        uses: ./.github/actions/deployment-status
        with:
          state: Ready
          service: frontend
          environment: Preview
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Error
        if: failure()
        uses: ./.github/actions/deployment-status
        with:
          state: Error
          service: frontend
          environment: Preview
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
