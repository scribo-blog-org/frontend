name: PR checks

on:
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: scribo-frontend:pr
          build-args: |
            NEXT_PUBLIC_APP_API_URL=http://localhost:3001
            NEXT_PUBLIC_SOCKET_URL=ws://localhost:3002
            NEXT_PUBLIC_APP_VERCEL_PROJECT_PRODUCTION_URL=localhost:3000
