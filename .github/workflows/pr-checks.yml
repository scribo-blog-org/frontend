# Проверки pull request в master и dev для Next.js (сервис frontend).
# Обычная сборка без Docker: образ собирается и публикуется только при пуше
# в dev и master (deploy.yml). Таблица в комментарии PR обновляется после
# каждого этапа, пропущенные и упавшие этапы отмечаются сразу.

name: PR checks

on:
  pull_request:
    branches:
      - master
      - dev

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Build
    # Тот же aarch64, что и на машине: иначе PR проверял бы не ту платформу,
    # на которой потом работает сервис.
    runs-on: ubuntu-24.04-arm
    # Зависший job иначе держал бы строку "In progress" до шести часов.
    timeout-minutes: 15
    steps:
      # Код репозитория на раннере
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show checks
        uses: ./.github/actions/pr-steps
        with:
          step: init

      - name: Building
        id: deployment
        uses: ./.github/actions/deployment-status
        with:
          state: Building
          service: frontend
          environment: Preview

      - name: Install running
        uses: ./.github/actions/pr-steps
        with:
          step: install
          state: running

      # В package.json нет engines.node, образ собирается на node:22, поэтому CI закреплён на 22.x. Кэш npm по package-lock.json
      - name: Setup Node.js
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      # Зависимости строго по lock-файлу
      - name: Install dependencies
        id: install
        run: npm ci

      # Падение установки Node тоже считается падением этапа Install
      - name: Install status
        if: always()
        uses: ./.github/actions/pr-steps
        with:
          step: install
          state: ${{ steps.node.outcome != 'success' && steps.node.outcome != 'skipped' && steps.node.outcome || steps.install.outcome }}

      - name: Lint running
        if: success()
        uses: ./.github/actions/pr-steps
        with:
          step: lint
          state: running

      # ESLint и проверка форматирования Prettier (npm run lint)
      - name: Lint
        id: lint
        if: success()
        run: npm run lint

      - name: Lint status
        if: always()
        uses: ./.github/actions/pr-steps
        with:
          step: lint
          state: ${{ steps.lint.outcome }}

      - name: Test running
        if: success()
        uses: ./.github/actions/pr-steps
        with:
          step: test
          state: running

      # Vitest: SEO-метаданные, навигация, парсеры и редирект ленты (npm run test)
      - name: Test
        id: test
        if: success()
        run: npm run test

      - name: Test status
        if: always()
        uses: ./.github/actions/pr-steps
        with:
          step: test
          state: ${{ steps.test.outcome }}

      - name: Build running
        if: success()
        uses: ./.github/actions/pr-steps
        with:
          step: build
          state: running

      # Обычная сборка проекта. Образ здесь не нужен: Dockerfile проверяется
      # при пуше в dev, до того как изменения попадут в master.
      - name: Build
        id: build
        if: success()
        run: npm run build

      - name: Build status
        if: always()
        uses: ./.github/actions/pr-steps
        with:
          step: build
          state: ${{ steps.build.outcome }}

      - name: Ready
        if: success()
        uses: ./.github/actions/deployment-status
        with:
          state: Ready
          service: frontend
          environment: Preview
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Error
        if: failure()
        uses: ./.github/actions/deployment-status
        with:
          state: Error
          service: frontend
          environment: Preview
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Cancelled
        if: cancelled()
        uses: ./.github/actions/deployment-status
        with:
          state: Cancelled
          service: frontend
          environment: Preview
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
